<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShotMath</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f141b; color: #e8eef5; max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; }
  p.sub { color: #9fb0c3; margin: 0 0 20px; }
  .presets { margin: 0 0 20px; }
  .presets button { background: #1c2530; color: #9fc2e8; border: 1px solid #2d3b4d; border-radius: 999px; padding: 8px 16px; margin: 0 8px 8px 0; cursor: pointer; font-size: .9rem; }
  .presets button:hover { background: #253243; }
  section { background: #16202c; border: 1px solid #243143; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: #9fb0c3; margin-bottom: 4px; }
  input, select { background: #0f141b; border: 1px solid #2d3b4d; color: #e8eef5; border-radius: 8px; padding: 9px 10px; width: 110px; font-size: 1rem; }
  .outs { display: flex; flex-wrap: wrap; gap: 14px; }
  .out { background: #101922; border: 1px solid #243143; border-radius: 12px; padding: 14px 18px; min-width: 140px; flex: 1; }
  .out .v { font-size: 1.5rem; font-weight: 700; color: #7fc4ff; }
  .out .k { font-size: .8rem; color: #9fb0c3; margin-top: 4px; }
  .wide { min-width: 260px; }
  .wide .v { font-size: 1.05rem; line-height: 1.45; }
</style>
</head>
<body>
<h1>&#9749; ShotMath</h1>
<p class="sub">Espresso extraction math - the shot knows before your tongue does.</p>
<div class="presets" id="presets"></div>

<section>
  <h2>1. The shot</h2>
  <div class="row">
    <div><label>Dose (g)</label><input id="dose" type="number" step="0.5" value="18"></div>
    <div><label>Yield (g)</label><input id="yield" type="number" step="0.5" value="36"></div>
    <div><label>Time (s)</label><input id="time" type="number" step="1" value="28"></div>
    <div><label>Taste</label><select id="taste">
      <option value="balanced">balanced</option>
      <option value="sour">sour</option>
      <option value="bitter">bitter</option>
      <option value="weak">weak</option>
    </select></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-ratio">-</div><div class="k">Brew ratio</div></div>
    <div class="out"><div class="v" id="o-ratioclass">-</div><div class="k">Shot style</div></div>
    <div class="out wide"><div class="v" id="o-advice">-</div><div class="k">Diagnosis</div></div>
  </div>
</section>

<section>
  <h2>2. Refractometer (optional)</h2>
  <div class="row">
    <div><label>TDS (%)</label><input id="tds" type="number" step="0.1" value="9.5"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-ey">-</div><div class="k">Extraction yield</div></div>
    <div class="out"><div class="v" id="o-eyband">-</div><div class="k">Extraction band</div></div>
    <div class="out"><div class="v" id="o-strengthband">-</div><div class="k">Strength</div></div>
  </div>
</section>

<section>
  <h2>3. Caffeine today</h2>
  <div class="row">
    <div><label>Single-shot equivalents</label><input id="shots" type="number" step="1" value="4"></div>
  </div>
  <div class="outs">
    <div class="out"><div class="v" id="o-caff">-</div><div class="k">Caffeine</div></div>
    <div class="out wide"><div class="v" id="o-caffband">-</div><div class="k">Daily guideline</div></div>
  </div>
</section>

<script>
// ShotMath engine - espresso extraction math. Pure functions, no DOM.
(function (root) {
  'use strict';

  // Brew ratio = beverage mass / dry dose.
  function brewRatio(doseG, yieldG) {
    if (doseG <= 0) throw new Error('dose must be positive');
    return yieldG / doseG;
  }

  // Ratio classification bands.
  function ratioClass(ratio) {
    if (ratio < 1.0) return 'under-extracted concentrate - did the shot stall?';
    if (ratio < 1.5) return 'ristretto';
    if (ratio < 2.5) return 'normale';
    if (ratio < 4.0) return 'lungo';
    return 'over-diluted - this is coffee-flavored water';
  }

  // Extraction yield % = TDS(%) * yield(g) / dose(g). Needs a refractometer reading.
  function extractionYield(tdsPct, yieldG, doseG) {
    if (doseG <= 0) throw new Error('dose must be positive');
    return tdsPct * yieldG / doseG;
  }

  // EY bands (espresso): 18-22 is the classic sweet window.
  function eyBand(ey) {
    if (ey < 16) return 'way under - sour and salty, grind finer';
    if (ey < 18) return 'under-extracted - sweetness left in the puck';
    if (ey <= 22) return 'sweet window - balanced extraction';
    if (ey <= 24) return 'pushing over - dry edges appearing';
    return 'over-extracted - bitter and ashy, grind coarser';
  }

  // Strength (TDS) bands for straight espresso.
  function strengthBand(tds) {
    if (tds < 6) return 'thin - watery body';
    if (tds < 7.5) return 'light - filter-like espresso';
    if (tds <= 12) return 'classic espresso strength';
    if (tds <= 14) return 'heavy - syrupy and intense';
    return 'muddy - likely channeling or a stalled shot';
  }

  // Shot diagnosis from ratio + time + taste. Returns advice string.
  function diagnose(ratio, timeSec, taste) {
    var fast = timeSec < 20, slow = timeSec > 35;
    if (taste === 'sour') {
      if (fast) return 'Sour and fast: under-extracted. Grind finer to slow the flow, or pull a longer ratio.';
      if (slow) return 'Sour but slow: likely channeling. Check distribution and tamp level before touching the grind.';
      return 'Sour at normal speed: under-extracted. Grind a touch finer or raise dose 0.5g.';
    }
    if (taste === 'bitter') {
      if (slow) return 'Bitter and slow: over-extracted. Grind coarser to speed the flow, or shorten the ratio.';
      if (fast) return 'Bitter but fast: uneven extraction (channeling). Improve puck prep before changing grind.';
      return 'Bitter at normal speed: over-extracted. Grind a touch coarser or drop water temperature 2C.';
    }
    if (taste === 'weak') {
      if (ratio > 2.5) return 'Weak with a long ratio: pull shorter - cut the yield, not the dose.';
      return 'Weak at a normal ratio: raise the dose or grind finer for more strength.';
    }
    // balanced
    if (fast) return 'Tastes balanced but ran fast: you may be leaving sweetness behind. Try 2-3 clicks finer.';
    if (slow) return 'Tastes balanced but ran slow: fine if the cup is good, but watch for astringency.';
    return 'Balanced in the window: log this recipe and stop touching things.';
  }

  // Caffeine tally: shots * ~63mg per single-shot equivalent. doubles = 2.
  function caffeineMg(singleShotEquivs) {
    return singleShotEquivs * 63;
  }
  function caffeineBand(mg) {
    if (mg <= 0) return 'no caffeine yet';
    if (mg < 200) return 'well under the 400mg daily guideline';
    if (mg <= 400) return 'within the 400mg daily guideline';
    return 'over the 400mg daily guideline - switch to decaf';
  }

  // Milk drink water/milk targets by style for a cup size (ml). Returns milk ml.
  function milkFor(style, cupMl, espressoMl) {
    var rest = Math.max(0, cupMl - espressoMl);
    var ratios = { cortado: 1.0, flatwhite: 2.0, cappuccino: 2.5, latte: 4.0 };
    var m = ratios[style];
    if (!m) throw new Error('unknown style');
    // milk volume as ratio of espresso volume, capped at what the cup holds
    return Math.min(rest, espressoMl * m);
  }

  var api = {
    brewRatio: brewRatio,
    ratioClass: ratioClass,
    extractionYield: extractionYield,
    eyBand: eyBand,
    strengthBand: strengthBand,
    diagnose: diagnose,
    caffeineMg: caffeineMg,
    caffeineBand: caffeineBand,
    milkFor: milkFor
  };
  root.ShotMath = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var E = window.ShotMath;
  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
  function txt(id) { return document.getElementById(id).value; }
  function set(id, v) { document.getElementById(id).textContent = v; }

  function compute() {
    var dose = num('dose'), yld = num('yield'), time = num('time');
    var taste = txt('taste'), tds = num('tds'), shots = num('shots');
    if (dose > 0 && yld > 0) {
      var ratio = E.brewRatio(dose, yld);
      set('o-ratio', '1:' + (Math.round(ratio * 100) / 100));
      set('o-ratioclass', E.ratioClass(ratio));
      set('o-advice', E.diagnose(ratio, time, taste));
      var ey = E.extractionYield(tds, yld, dose);
      set('o-ey', (Math.round(ey * 10) / 10) + '%');
      set('o-eyband', E.eyBand(ey));
      set('o-strengthband', E.strengthBand(tds));
    }
    var mg = E.caffeineMg(shots);
    set('o-caff', mg + ' mg');
    set('o-caffband', E.caffeineBand(mg));
  }

  var presets = [
    { name: 'Classic normale', v: { dose: 18, yield: 36, time: 28, taste: 'balanced', tds: 9.5, shots: 4 } },
    { name: 'Ristretto', v: { dose: 18, yield: 22, time: 25, taste: 'balanced', tds: 11.0, shots: 2 } },
    { name: 'Fast and sour', v: { dose: 18, yield: 40, time: 16, taste: 'sour', tds: 7.8, shots: 2 } },
    { name: 'Slow and bitter', v: { dose: 18, yield: 32, time: 42, taste: 'bitter', tds: 11.5, shots: 2 } }
  ];
  var holder = document.getElementById('presets');
  presets.forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p.name;
    b.addEventListener('click', function () {
      Object.keys(p.v).forEach(function (k) {
        var el = document.getElementById(k);
        if (el) el.value = p.v[k];
      });
      compute();
    });
    holder.appendChild(b);
  });

  ['dose', 'yield', 'time', 'taste', 'tds', 'shots'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener('input', compute);
    el.addEventListener('change', compute);
  });
  compute();
})();
</script>
</body>
</html>
